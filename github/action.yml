name: "Zode GitHub Action"
description: "Run Zode AI agent in GitHub Actions workflows"
branding:
  icon: "code"
  color: "gray-dark"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the Zode session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of Zode App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/zode,/kc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://__PRESERVE_API_ZODE_AI__"
    required: false

  zode_api_key:
    description: "Zode API key for gateway authentication"
    required: false

  zode_org_id:
    description: "Zode organization ID"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get Zode version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/Zode-Org/zodecode/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache Zode
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.zode/bin
        key: zode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install Zode
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://__PRESERVE_ZODE_AI__/cli/install | bash

    - name: Add Zode to PATH
      shell: bash
      run: echo "$HOME/.zode/bin" >> $GITHUB_PATH

    - name: Run Zode
      shell: bash
      id: run_zode
      run: zode github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        ZODE_API_KEY: ${{ inputs.zode_api_key }}
        ZODE_ORG_ID: ${{ inputs.zode_org_id }}
