name: triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: github.repository == 'Zode-Org/zodecode'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # zodecode_change
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Zode
        uses: ./.github/actions/setup-zode

      - name: Triage issue
        env:
          ZODE_API_KEY: ${{ secrets.ZODE_API_KEY }}
          ZODE_ORG_ID: ${{ secrets.ZODE_ORG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          zode run --agent triage "The following issue was just opened, triage it:

          Title: $ISSUE_TITLE

          $ISSUE_BODY"
