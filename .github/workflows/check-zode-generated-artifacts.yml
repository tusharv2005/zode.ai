# zodecode_change - new file
name: Check Zode generated artifacts

on:
  pull_request:
    paths:
      - ".gitignore"
      - ".github/workflows/check-zode-generated-artifacts.yml"
      - ".zode/**"
      - ".zodecode/**"
      - "script/check-zode-generated-artifacts.ts"
  workflow_dispatch:

jobs:
  check:
    name: Check Zode generated artifacts
    if: github.repository == 'Zode-Org/zodecode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # zodecode_change
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2

      - name: Run check
        run: bun run script/check-zode-generated-artifacts.ts
