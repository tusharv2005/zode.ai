name: Check Links

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/zode-docs/**"
      - ".github/workflows/docs-check-links.yml"
  schedule:
    # Run daily at 9am UTC
    - cron: "0 9 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  link-checker:
    if: github.repository == 'Zode-Org/zodecode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # zodecode_change

      - name: Link Checker
        uses: Zode-Org/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411
        with:
          args: "**/*.md"
          workingDirectory: packages/zode-docs
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
